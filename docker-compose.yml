x-runtime: &runtime
  image: pawlish-app:local
  env_file: ./src/.env
  environment:
    DB_DATABASE: /var/www/html/database/database.sqlite
  restart: unless-stopped
  volumes:
    - sqlite_data:/var/www/html/database
  networks: [backend]

services:
  app:
    <<: *runtime
    build: .
    volumes:
      - sqlite_data:/var/www/html/database
      - public_assets:/var/www/html/public
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/pawlish-ready && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  worker:
    <<: *runtime
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60"]
    depends_on:
      app:
        condition: service_healthy
  scheduler:
    <<: *runtime
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  backend:
    driver: bridge
volumes:
  sqlite_data:
  public_assets:
